[package]
name = "proto-uv-backend"
version = "0.1.0"
edition = "2024"
description = "A proto WASM backend for Python command-line tools installed with uv."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
proto_pdk_api = "=0.33.0"
pep440_rs = "0.7.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
extism-pdk = "=1.4.1"
proto_pdk = "=0.34.0"
schematic = { version = "0.19", default-features = false, features = ["schema"] }

[features]
default = ["wasm"]
wasm = []

[profile.release]
codegen-units = 1
debug = false
lto = true
opt-level = "s"
panic = "abort"
strip = true
